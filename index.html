<!DOCTYPE html>
<html>
  <head>
  <title>Eggplant Clicker</title>
 <style>

    *{
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #2b2b2b;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: row;
      min-width: 0; /* No forced minimum width, so the page can shrink on mobile */
      overflow-x: hidden;
    }
    html{
      min-width: 0; /* No forced minimum width, so the page can shrink on mobile */
    }
    /* Header styling */
    .header {
      background-color: #444;
      padding: 15px 20px;
      text-align: center;
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000; /* Space for the header */
    }
    

    .header-txt {
      flex-grow: 1; /* Center the text */
      font-size: clamp(20px, 5vw, 36px);
      font-weight: bold;
      color: #f4f4f4;
    }

    /* Counter styling */
    .counter {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      font-size: clamp(18px, 4vw, 24px);
      margin-top: 20px;
      
     /* Push below the header */
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
     
    /* Eggplant container styling */
    .eggplant-container {
      margin: 20px auto;
      width: min(200px, 45vw); /* Scales down on narrow screens */
      height: min(200px, 45vw);
      
      align-items: center;
    }

    .eggplantButton {
      background: none;
      border: none;
      cursor: pointer;
      width: 100%;
      height: 100%;
      padding: 0;
      
    }

    .eggplant {
      border-radius: 5%;
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease-in-out;
    }
    .counter-container {
      align-items: center;
      background-color: blueviolet;
      flex: 0 0 auto;
      width: 100%;
      max-width: 300px;
      padding-bottom: 20px;
    }

    .eggplant:hover {
      transform: scale(1.1); /* Slightly enlarge on hover */
    }

    .eggplant:active {
      transform: scale(0.9); /* Shrink slightly when clicked */
    }
    .items {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); /* Grid layout with responsive columns */
    gap: 20px; /* Space between items */
    margin-top: 30px;
    text-align: center;
    flex: 1 1 260px;
    max-width: 520px; /* Maximum width to fit five items at 100px each with gaps */
    }

    .item {
      background-color: #555;
      text-align: center;
      color: #fff;
      border: 1px solid #777;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      transition: background-color 0.2s;
      position: relative; /* For positioning the text box */
    }
    .item:hover {
      background-color: #666;
    }

    .item img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    .item-title,
    .item-cost {
      display: none; /* Hide text by default */
    }

    .item:hover .item-title{
      display: block; /* Show text on hover */
      position: absolute; /* Position relative to the .item */
      top: -10px; /* Position the textbox above the item */
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.8); /* Semi-transparent background */
      color: #fff;
      padding: 5px 10px;
      border-radius: 5px;
      white-space: nowrap; /* Prevent text wrapping */
      z-index: 10; /* Ensure it appears above other elements */
      font-size: 14px; /* Adjust font size for better readability */
    }
    .item:hover .item-cost {
      display: block; /* Show text on hover */
      position: absolute; /* Position relative to the .item */
      top: -30px; /* Position the textbox above the item */
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.8); /* Semi-transparent background */
      color: #fff;
      padding: 5px 10px;
      border-radius: 5px;
      white-space: nowrap; /* Prevent text wrapping */
      z-index: 10; /* Ensure it appears above other elements */
      font-size: 14px; /* Adjust font size for better readability */
    }
    /* Upgrades section styling */
    .upgrades {
      margin-top: 30px;
      text-align: left;
      flex: 1 1 280px;
      max-width: 400px;
    }

    .upgrade {
      background-color: #555;
      text-align: left;
      color: #fff;
      border: 1px solid #777;
      padding: 10px;
      padding-left: 16px;
      margin: 10px 0;
      width: 100%;
      cursor: pointer;
      display: block;
      border-radius: 5px;
      transition: background-color 0.2s;
    }

    .upgrade:hover {
      background-color: #666;
    }

    .upgrade:disabled {
      background-color: #333;
      cursor: not-allowed;
    }
    .buttonimg {
      width: 50px;
      height: 50px;
      margin-right: 10px;
      vertical-align: middle;
    }
    .header-button {
      background-color: #f44336; /* Red color for the reset button */
      height: 40px;
      
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin-right: 20px; /* Space between button and text */
    }
    .insides {
      margin-top: 150px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      vertical-align: top;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      padding: 0 20px;
       /* Full viewport height */
       /* Space for the header */
    }
    
    .gps{
      display: flex;
      justify-content: center;
      font-size: clamp(14px, 3.5vw, 18px);
      color: #ffffff;
      margin-top: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
    }
    .disabled{
      background-color: #333333; /* Grey color for disabled text */
      cursor: not-allowed; /* Change cursor to indicate disabled state */
    }

    /* Tablet and below: stack the three columns and let the header wrap */
    @media (max-width: 900px) {
      .insides {
        margin-top: 170px;
        justify-content: center;
      }
      .items,
      .upgrades {
        max-width: 480px;
      }
    }

    /* Phones: single column, full-width panels, smaller header button */
    @media (max-width: 600px) {
      .header {
        padding: 10px;
      }
      .header-button {
        height: 34px;
        padding: 8px 14px;
        font-size: 14px;
        margin-right: 0;
      }
      .insides {
        margin-top: 190px;
        flex-direction: column;
        align-items: center;
        padding: 0 12px;
      }
      .counter-container,
      .items,
      .upgrades {
        max-width: 100%;
        width: 100%;
      }
      .items {
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
        gap: 12px;
      }
      .upgrade {
        margin: 8px 0;
      }
      .buttonimg {
        width: 40px;
        height: 40px;
      }
    }
    </style> 
      
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <!-- Header Section -->
  <div class="header">
    <button class="header-button"  >Reset</button>
    <p class="header-txt">Eggplant Clicker</p>
    
  </div>
  <div class="insides">
    <!-- Counter Section -->
    <div class="counter-container">
      <div class="counter">
        Ejaculations: <span class="points">0</span>
        
      </div>
      <div class="gpsdiv">
      <p class="gps">Ejaculations per second:</p></div>
      <!-- Eggplant Button Section -->
      <div class="eggplant-container">
        <button class="eggplantButton" id="eggplantButton">
          <img class="eggplant" src="download-good.jpg" draggable="false" alt="Eggplant">
        </button>
      </div>
    </div>
    <div class="items js-items">

    </div>

    <!-- Upgrades Section -->
    <div class="upgrades js-upgrades">
      
      
    </div>
  </div>
  <script src="clicker.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
