<!DOCTYPE html>
<html>
  <head>
  <title>Eggplant Clicker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #2b2b2b;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: row;
      min-width: 800px; /* Minimum width for the page */
    }
    html{
      min-width: 800px; /* Minimum width for the page */
    }
    /* Header styling */
    .header {
      background-color: #444;
      padding: 20px;
      text-align: center;
      align-items: center;
      display: flex;
      
      width: 100%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000; /* Space for the header */
    }

    .header-txt {
      flex-grow: 1; /* Center the text */
      font-size: 36px;
      font-weight: bold;
      color: #f4f4f4;
    }

    /* Counter styling */
    .counter {
      display: flex;
      flex-direction: row;
      justify-content: center;
      font-size: 24px;
      margin-top: 40px;
      
     /* Push below the header */
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
     
    /* Eggplant container styling */
    .eggplant-container {
      margin-left: 50px;
      margin-top: 50px;
      width: 200px; /* Fixed width for the eggplant button */
      height: 200px; /* Fixed height for the eggplant button */
      
      
      align-items: center;
    }

    .eggplantButton {
      background: none;
      border: none;
      cursor: pointer;
      
    }

    .eggplant {
      border-radius: 5%;
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease-in-out;
    }
    .counter-container {
      align-items: right;
      position: fixed;
      background-color: blueviolet;
      left : 0px;
      top : 150px;
      height: 100%;
      width: 300px; /* Fixed position for the counter container */
       /* Fixed position on the left */

    }

    .eggplant:hover {
      transform: scale(1.1); /* Slightly enlarge on hover */
    }

    .eggplant:active {
      transform: scale(0.9); /* Shrink slightly when clicked */
    }

    /* Upgrades section styling */
    .upgrades {
      margin-top: 30px;
      margin-left: 300px;
      align-self: right;
      text-align: left;
    }

    .upgrade {
      background-color: #555;
      text-align: left;
      color: #fff;
      border: 1px solid #777;
      padding: 10px;
      padding-left: 16px;
      margin: 10px;
      margin-right: 100px;
      width: 90%;
      cursor: pointer;
      display: block;
      border-radius: 5px;
      transition: background-color 0.2s;
    }

    .upgrade:hover {
      background-color: #666;
    }

    .upgrade:disabled {
      background-color: #333;
      cursor: not-allowed;
    }
    .buttonimg {
      width: 50px;
      height: 50px;
      margin-right: 10px;
      vertical-align: middle;
    }
    .header-button {
      background-color: #f44336; /* Red color for the reset button */
      height: 40px;
      
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin-right: 20px; /* Space between button and text */
    }
    .insides {
      margin-top: 150px;
      display: flex;
      flex-direction: row;
      vertical-align: top;
      
      justify-content: right;
      width: 100%;
       /* Full viewport height */
       /* Space for the header */
    }
    .gps{
      display: flex;
      justify-content: center;
      font-size: 18px;
      color: #ffffff;
      margin-top: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
    }
    .disabled{
      background-color: #333333; /* Grey color for disabled text */
      cursor: not-allowed; /* Change cursor to indicate disabled state */
    }
    </style>
      
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <!-- Header Section -->
  <div class="header">
    <button class="header-button"  >Reset</button>
    <p class="header-txt">Eggplant Clicker</p>
    
  </div>
  <div class="insides">
    <!-- Counter Section -->
  <div class="counter-container">
    <div class="counter">
      Juicings: <span class="points">0</span>
      
    </div>
    <div class="gpsdiv">
    <p class="gps">Juicings per second:</p></div>
    <!-- Eggplant Button Section -->
    <div class="eggplant-container">
      <button class="eggplantButton" id="eggplantButton">
        <img class="eggplant" src="download-good.jpg" draggable="false" alt="Eggplant">
      </button>
    </div>
  </div>
    <div class="items">

    </div>

    <!-- Upgrades Section -->
    <div class="upgrades">
      
      
    </div>
  </div>
  <script src="clicker.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
